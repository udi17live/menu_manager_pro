
services:
  postgres:
    image: postgres:17-alpine
    container_name: menu_manager_postgres
    restart: always
    ports:
      - "${PORT_HOST:-5440}:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
